name: NuClick Nuclei Segmentation
name_short: nuclick
version: 0.1.6
namespace: com.cytomine.nuclei.segmentation.interactive.nuclick
$schema: https://raw.githubusercontent.com/cytomine/cytomine/refs/heads/main/app-engine/src/main/resources/schemas/tasks/task.v0.json

external:
  dois:
    - https://doi.org/10.1016/j.media.2020.101771
  source_code: https://github.com/TissueImageAnalytics/tiatoolbox

authors:
  - first_name: Gozde
    last_name: Gunesli
    organization: TIA Centre University of Warwick
    email: gozde.gunesli@warwick.ac.uk
    is_contact: true

configuration:
  input_folder: /inputs
  output_folder: /outputs
  image:
    file: /com.cytomine.nuclei.segmentation.interactive.nuclick-0.1.6.tar
  resources:
    ram: 8Gi
    cpus: 2

inputs:
  image:
    display_name: Input image
    description: The input image (PNG/JPG/TIFF) containing nuclei to be segmented. WSI formats are not supported; export a region from the WSI viewer first.
    type:
      id: image
      max_width: 10000
      max_height: 10000

  points:
    display_name: Click points
    description: Point geometries indicating the nuclei to segment (one click per nucleus)
    type:
      id: array
      min_size: 1
      max_size: 1000
      subtype:
        id: geometry

outputs:
  nuclei:
    display_name: Segmented nuclei
    description: Per-nucleus polygon geometries produced by NuClick
    type:
      id: array
      subtype:
        id: geometry
